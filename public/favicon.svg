<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Brand Logo: The "Play-D" -->
  
  <!-- Outer Container (App Icon Shape) - Black -->
  <rect width="512" height="512" rx="120" fill="#000000" />
  
  <!-- The "D" Shape with Play Button Negative Space -->
  <!-- A solid white block forming a D, but the hole is a triangle -->
